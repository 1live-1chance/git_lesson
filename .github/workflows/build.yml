name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 \
            libxcb-randr0-dev \
            libxcb-xtest0-dev \
            libxcb-shape0-dev \
            libxcb-xinerama0-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # --- Build step per OS ---
      - name: Build executable (Linux)
        if: runner.os == 'Linux'
        run: pyinstaller --onefile --windowed --name CoffeeManager --distpath dist main.py

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --onefile --windowed --name CoffeeManager --distpath dist main.py

      - name: Build executable (macOS)
        if: runner.os == 'macOS'
        run: pyinstaller --onefile --windowed --name CoffeeManager --distpath dist main.py

      # --- Rename step per OS ---
      - name: Rename executable (Linux)
        if: runner.os == 'Linux'
        run: mv dist/CoffeeManager dist/coffee-manager-linux

      - name: Rename executable (Windows)
        if: runner.os == 'Windows'
        run: mv dist/CoffeeManager.exe dist/coffee-manager-windows.exe

      - name: Rename executable (macOS)
        if: runner.os == 'macOS'
        run: mv dist/CoffeeManager dist/coffee-manager-macos

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: coffee-manager-${{ runner.os }}
          path: dist/coffee-manager-*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            coffee-manager-Linux/coffee-manager-linux
            coffee-manager-Windows/coffee-manager-windows.exe
            coffee-manager-macOS/coffee-manager-macos
          body: |
            # Coffee Manager Release ${{ steps.get_version.outputs.VERSION }}

            ## Downloads
            - **Linux**: `coffee-manager-linux`
            - **Windows**: `coffee-manager-windows.exe`
            - **macOS**: `coffee-manager-macos`

            ## Changes
            - Initial release

            ## Requirements
            - Python 3.11+
            - PyQt6

  source-release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create source archive
        run: |
          tar -czf coffee-manager-source-${{ steps.get_version.outputs.VERSION }}.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.venv' \
            --exclude='dist' \
            --exclude='build' \
            --exclude='*.spec' \
            .

      - name: Upload source archive to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          files: coffee-manager-source-${{ steps.get_version.outputs.VERSION }}.tar.gz
